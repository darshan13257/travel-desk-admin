<div class="travel-details-container">
  <div class="form-card">
    <h2>{{ isEditMode ? 'Edit Travel Booking' : 'Create Travel Booking' }}</h2>
    
    <form [formGroup]="travelForm" (ngSubmit)="onSubmit()" class="travel-form">
      <div class="form-grid">
        <!-- First row -->
        <div class="form-group">
          <label for="travelMode">Travel Mode*</label>
          <div class="select-wrapper">
            <select id="travelMode" formControlName="TravelMode">
              <option value="">Select Travel Mode</option>
              <option *ngFor="let mode of travelModes" [value]="mode.value">
                {{mode.name}}
              </option>
            </select>
          </div>
        </div>

        <div>
          <div class="form-group"></div>
          <label for="providerName">Sponsered By*</label>
          <div class="select-wrapper">
            <select id="providerName" formControlName="providerName">
              <option value="">Select any</option>
              <option *ngFor="let location of sponseredBy" [value]="location.value">
                {{location.label}}
              </option>
            </select>
          </div>
        </div>
        

        <div class="form-group"  style="display: none;">
          <label for="bookingReference">Booking Reference*</label>
          <div class="input-wrapper">
            <i class="fas fa-ticket"></i>
            <input id="bookingReference" 
                   type="text" 
                   formControlName="BookingReference"
                   placeholder="Enter booking reference" value="123456">
          </div>
        </div>

        <div class="form-group">
          <label for="startDate">Start Date*</label>
          <div class="input-wrapper">
            <i class="fas fa-calendar"></i>
            <input id="startDate" 
                   type="date" 
                   formControlName="StartDate">
          </div>
        </div>

        <div class="form-group">
          <label for="endDate">End Date*</label>
          <div class="input-wrapper">
            <i class="fas fa-calendar"></i>
            <input id="endDate" 
                   type="date" 
                   formControlName="EndDate">
          </div>
        </div>

        <div class="form-group">
          <label for="totalCost">Total Cost*</label>
          <div class="input-wrapper">
            <i class="fas fa-rupee-sign"></i>
            <input id="totalCost" 
                   type="number" 
                   formControlName="TotalCost"
                   placeholder="Enter total cost">
          </div>
        </div>

        <div class="form-group">
          <label for="fromLocation">From Location*</label>
          <div class="select-wrapper">
            <select id="fromLocation" formControlName="FromLocation">
              <option value="">Select from location</option>
              <option *ngFor="let location of locations" [value]="location.id">
                {{location.name}}
              </option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="toLocation">To Location*</label>
          <div class="select-wrapper">
            <select id="toLocation" formControlName="ToLocation">
              <option value="">Select to location</option>
              <option *ngFor="let location of locations" [value]="location.id">
                {{location.name}}
              </option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">
          Cancel
        </button>
        <button type="submit" 
                class="btn btn-primary" 
                [disabled]="!travelForm.valid || loading">
          {{ loading ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
