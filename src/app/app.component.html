<div class="app-container">
  <!-- Show navbar only when not on login route -->
  <app-navbar *ngIf="!isLoginPage"></app-navbar>
  
  <div class="content-wrapper" [class.login-page]="isLoginPage">
    <!-- Show sidebar only on travel-form routes and not on login -->
    <app-sidebar *ngIf="showSidebar && !isLoginPage"></app-sidebar>
    
    <!-- Main content area - full width when no sidebar -->
    <main [class.full-width]="!showSidebar || isLoginPage">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
