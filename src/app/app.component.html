<div class="app-container">
  <!-- Show navbar and sidebar only when not on login page -->
  <app-navbar *ngIf="showNavbar"></app-navbar>
  
  <div class="content-wrapper" *ngIf="showNavbar">
    <app-sidebar></app-sidebar>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Full-width login page when on login route -->
  <main class="login-content" *ngIf="!showNavbar">
    <router-outlet></router-outlet>
  </main>
</div>
