<p-dialog 
  [(visible)]="visible" 
  [modal]="true" 
  [style]="{width: '500px'}" 
  [draggable]="false"
  [resizable]="false"
  (onHide)="onCancel()"
  styleClass="itinerary-modal">
  
  <ng-template pTemplate="header">
    <div class="modal-header">
      <h2>{{ isEditMode ? 'Edit' : 'Add New' }} Itinerary</h2>
      <p class="subtitle">Fill in the details for your itinerary item</p>
    </div>
  </ng-template>

  <form [formGroup]="itineraryForm" class="p-fluid">
    <div class="form-grid">
      <!-- Time Selection -->
      <div class="p-grid">
        <div class="p-col-6">
          <div class="field">
            <label for="fromTime">From Time</label>
            <p-calendar 
              id="fromTime"
              formControlName="FromTime"
              [timeOnly]="true"
              [showTime]="true"
              inputId="timeonly">
            </p-calendar>
          </div>
        </div>
        <div class="p-col-6">
          <div class="field">
            <label for="toTime">To Time</label>
            <p-calendar 
              id="toTime"
              formControlName="ToTime"
              [timeOnly]="true"
              [showTime]="true"
              inputId="timeonly">
            </p-calendar>
          </div>
        </div>
      </div>

      <!-- Type Selection -->
      <div class="field">
        <label for="type">Type</label>
        <p-dropdown
          id="type"
          formControlName="Type"
          [options]="typeOptions"
          optionLabel="label"
          optionValue="value"
          [style]="{'width':'100%'}"
          placeholder="Select a type">
        </p-dropdown>
      </div>

      <!-- Dynamic Fields based on Type -->
      <ng-container [ngSwitch]="itineraryForm.get('Type')?.value">
        <!-- Traveling Fields -->
        <ng-container *ngSwitchCase="'traveling'">
          <div class="p-grid">
            <div class="p-col-6">
              <div class="field">
                <label for="fromDest">From Destination</label>
                <input 
                  id="fromDest"
                  type="text" 
                  pInputText 
                  formControlName="FromDestination">
              </div>
            </div>
            <div class="p-col-6">
              <div class="field">
                <label for="toDest">To Destination</label>
                <input 
                  id="toDest"
                  type="text" 
                  pInputText 
                  formControlName="ToDestination">
              </div>
            </div>
          </div>

          <div class="field">
            <label for="bookingId">Booking ID</label>
            <input 
              id="bookingId"
              type="text" 
              pInputText 
              formControlName="BookingId">
          </div>

          <div class="field">
            <label for="travelBy">Travel By</label>
            <p-dropdown
              id="travelBy"
              formControlName="TravelBy"
              [options]="travelByOptions"
              optionLabel="label"
              optionValue="value"
              [style]="{'width':'100%'}"
              placeholder="Select travel mode">
            </p-dropdown>
          </div>
        </ng-container>

        <!-- Stay Fields -->
        <ng-container *ngSwitchCase="'stay'">
          <div class="field">
            <label for="location">Location</label>
            <input 
              id="location"
              type="text" 
              pInputText 
              formControlName="Location">
          </div>

          <div class="field">
            <label for="stayBookingId">Booking ID</label>
            <input 
              id="stayBookingId"
              type="text" 
              pInputText 
              formControlName="BookingId">
          </div>
        </ng-container>

        <!-- Miscellaneous Fields -->
        <ng-container *ngSwitchCase="'miscellaneous'">
          <div class="field">
            <label for="miscLocation">Location</label>
            <input 
              id="miscLocation"
              type="text" 
              pInputText 
              formControlName="Location">
          </div>
        </ng-container>
      </ng-container>

      <!-- Description Field -->
      <div class="field">
        <label for="description">Description</label>
        <textarea 
          id="description"
          pInputTextarea 
          formControlName="Description"
          [rows]="3"
          [autoResize]="true">
        </textarea>
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="modal-footer">
      <button 
        pButton 
        label="Cancel" 
        class="p-button-outlined p-button-secondary" 
        (click)="onCancel()">
      </button>
      <button 
        pButton 
        [label]="isEditMode ? 'Update' : 'Create'" 
        [disabled]="!itineraryForm.valid"
        (click)="onSubmit()">
      </button>
    </div>
  </ng-template>
</p-dialog>
