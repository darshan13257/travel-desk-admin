<div class="modal-container">
  <h2 mat-dialog-title>{{ isEditMode ? 'Edit' : 'New' }} Itinerary</h2>

  <form [formGroup]="itineraryForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <!-- Common Fields -->
      <div class="form-row">
        <mat-form-field>
          <mat-label>From Time</mat-label>
          <input matInput type="time" formControlName="FromTime">
        </mat-form-field>

        <mat-form-field>
          <mat-label>To Time</mat-label>
          <input matInput type="time" formControlName="ToTime">
        </mat-form-field>
      </div>

      <mat-form-field>
        <mat-label>Type</mat-label>
        <mat-select formControlName="Type">
          <mat-option *ngFor="let option of typeOptions" [value]="option.value">
            {{option.label}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="Description" rows="3"></textarea>
      </mat-form-field>

      <!-- Dynamic Fields based on Type -->
      <ng-container [ngSwitch]="itineraryForm.get('Type')?.value">
        <!-- Traveling Fields -->
        <ng-container *ngSwitchCase="'traveling'">
          <div class="form-row">
            <mat-form-field>
              <mat-label>From Destination</mat-label>
              <input matInput formControlName="FromDestination">
            </mat-form-field>

            <mat-form-field>
              <mat-label>To Destination</mat-label>
              <input matInput formControlName="ToDestination">
            </mat-form-field>
          </div>

          <mat-form-field>
            <mat-label>Booking ID</mat-label>
            <input matInput formControlName="BookingId">
          </mat-form-field>

          <mat-form-field>
            <mat-label>Travel By</mat-label>
            <mat-select formControlName="TravelBy">
              <mat-option *ngFor="let option of travelByOptions" [value]="option.value">
                {{option.label}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </ng-container>

        <!-- Stay Fields -->
        <ng-container *ngSwitchCase="'stay'">
          <mat-form-field>
            <mat-label>Location</mat-label>
            <input matInput formControlName="Location">
          </mat-form-field>

          <mat-form-field>
            <mat-label>Booking ID</mat-label>
            <input matInput formControlName="BookingId">
          </mat-form-field>
        </ng-container>

        <!-- Miscellaneous Fields -->
        <ng-container *ngSwitchCase="'miscellaneous'">
          <mat-form-field>
            <mat-label>Location</mat-label>
            <input matInput formControlName="Location">
          </mat-form-field>
        </ng-container>
      </ng-container>
    </div>

    <div class="form-actions">
      <button type="button" mat-button (click)="onCancel()">Cancel</button>
      <button type="submit" mat-raised-button color="primary" [disabled]="!itineraryForm.valid">
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>
    </div>
  </form>
</div>
