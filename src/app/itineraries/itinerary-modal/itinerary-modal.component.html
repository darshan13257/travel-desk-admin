<div class="modal-container">
  <h2>{{ data.isEdit ? 'Edit' : 'New' }} Itinerary</h2>

  <mat-dialog-content>
    <form [formGroup]="itineraryForm" class="booking-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="travelId">Travel ID</label>
          <input type="number" id="travelId" formControlName="TravelId">
        </div>

        <div class="form-group">
          <label for="day">Day</label>
          <input type="number" id="day" formControlName="Day">
        </div>

        <div class="form-group">
          <label for="activity">Activity</label>
          <input type="text" id="activity" formControlName="Activity">
        </div>

        <div class="form-group">
          <label for="startTime">Start Time</label>
          <input type="time" id="startTime" formControlName="StartTime">
        </div>

        <div class="form-group">
          <label for="endTime">End Time</label>
          <input type="time" id="endTime" formControlName="EndTime">
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!itineraryForm.valid">
      {{ data.isEdit ? 'Update' : 'Create' }}
    </button>
  </mat-dialog-actions>
</div>
