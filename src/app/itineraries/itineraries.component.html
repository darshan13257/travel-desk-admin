<div class="itineraries-container">
  <div class="header">
    <h2>Itineraries</h2>
    <button mat-raised-button color="primary" (click)="openItineraryModal()">
      <i class="fas fa-plus"></i> Add Itinerary
    </button>
  </div>

  <div class="filters">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input 
        type="text" 
        placeholder="Search itineraries..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
      >
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Type</th>
          <th>Description</th>
          <th>Details</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredItineraries">
          <td>{{item.FromTime}} - {{item.ToTime}}</td>
          <td>{{item.Type | titlecase}}</td>
          <td>{{item.Description}}</td>
          <td>
            <ng-container [ngSwitch]="item.Type">
              <span *ngSwitchCase="'traveling'">
                {{item.FromDestination}} to {{item.ToDestination}} ({{item.TravelBy}})
              </span>
              <span *ngSwitchCase="'stay'">
                {{item.Location}} (Booking: {{item.BookingId}})
              </span>
              <span *ngSwitchCase="'miscellaneous'">
                {{item.Location}}
              </span>
            </ng-container>
          </td>
          <td class="actions">
            <button mat-icon-button (click)="openItineraryModal(item)">
              <i class="fas fa-edit"></i>
            </button>
            <button mat-icon-button color="warn" (click)="deleteItinerary(item.Id)">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
