<div class="itineraries-container">
  <div class="header">
    <h2>Itineraries</h2>
    <button pButton 
            label="Add Itinerary" 
            icon="pi pi-plus" 
            (click)="openItineraryModal()">
    </button>
  </div>

  <div class="filters">
    <div class="search-box">
      <i class="pi pi-search"></i>
      <input type="text" 
             pInputText 
             [(ngModel)]="searchTerm"
             (ngModelChange)="onSearchChange($event)"
             placeholder="Search itineraries...">
    </div>
  </div>

  <!-- Show table when there are records -->
  <p-table [value]="filteredItineraries" 
           [responsive]="true"
           *ngIf="filteredItineraries.length > 0">
    <ng-template pTemplate="header">
      <tr>
        <th>Day</th>
        <th>Time</th>
        <th>Activity</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>Day {{item.Day}}</td>
        <td>{{item.StartTime}} - {{item.EndTime}}</td>
        <td>{{item.Activity}}</td>
        <td>{{item.Description}}</td>
        <td>
          <button pButton 
                  icon="pi pi-pencil" 
                  class="p-button-text" 
                  (click)="openItineraryModal(item)">
          </button>
          <button pButton 
                  icon="pi pi-trash" 
                  class="p-button-text p-button-danger" 
                  (click)="deleteItinerary(item.ItineraryID)">
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Show this when no records found -->
  <div *ngIf="filteredItineraries.length === 0" class="no-records">
    <i class="pi pi-calendar"></i>
    <p>No itineraries found</p>
    <button pButton 
            label="Add New Itinerary" 
            icon="pi pi-plus" 
            (click)="openItineraryModal()">
    </button>
  </div>

  <app-itinerary-modal
    [(visible)]="showModal"
    [isEditMode]="!!selectedItinerary"
    [itinerary]="selectedItinerary"
    (save)="onSaveItinerary($event)">
  </app-itinerary-modal>
</div>
