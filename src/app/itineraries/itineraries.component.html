<div class="itineraries-container">
  <div class="header">
    <h2>Itineraries</h2>
    <button pButton 
            label="Add Itinerary" 
            icon="pi pi-plus" 
            (click)="openItineraryModal()">
    </button>
  </div>

  <div class="filters">
    <div class="search-box">
      <i class="pi pi-search"></i>
      <input type="text" 
             pInputText 
             [(ngModel)]="searchTerm"
             (ngModelChange)="onSearchChange($event)"
             placeholder="Search itineraries...">
    </div>
  </div>

  <p-table [value]="filteredItineraries" [responsive]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Description</th>
        <th>Details</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{item.FromTime}} - {{item.ToTime}}</td>
        <td>{{item.Type | titlecase}}</td>
        <td>{{item.Description}}</td>
        <td>
          <ng-container [ngSwitch]="item.Type">
            <span *ngSwitchCase="'traveling'">
              {{item.FromDestination}} to {{item.ToDestination}} ({{item.TravelBy}})
            </span>
            <span *ngSwitchCase="'stay'">
              {{item.Location}} (Booking: {{item.BookingId}})
            </span>
            <span *ngSwitchCase="'miscellaneous'">
              {{item.Location}}
            </span>
          </ng-container>
        </td>
        <td>
          <button pButton 
                  icon="pi pi-pencil" 
                  class="p-button-text" 
                  (click)="openItineraryModal(item)">
          </button>
          <button pButton 
                  icon="pi pi-trash" 
                  class="p-button-text p-button-danger" 
                  (click)="deleteItinerary(item.Id)">
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <app-itinerary-modal
    [(visible)]="showModal"
    [isEditMode]="!!selectedItinerary"
    [itinerary]="selectedItinerary"
    (save)="onSaveItinerary($event)">
  </app-itinerary-modal>
</div>
